[project]
name = "nagatoai_core"
version = "0.26.0"
description = "Nagato-AI is an intuitive AI Agent library that works across multiple LLMs"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Eddie Forson", email = "eddie@edforson.me" },
]
dependencies = [
    "anthropic>=0.42.0",
    "rich>=13.7.1,<14",
    "requests>=2.31.0,<3",
    "openai>=1.14.3,<2",
    "beautifulsoup4>=4.12.3,<5",
    "lxml>=5.1.0,<6",
    "pydantic>=2.6.4,<3",
    "python-dotenv>=1.0.1,<2",
    "pydantic-settings>=2.2.1,<3",
    "groq>=0.13.0",
    "python-dateutil>=2.9.0.post0,<3",
    "pytube>=15.0.0,<16",
    "python-levenshtein>=0.25.1,<0.26",
    "ffmpeg-python>=0.2.0,<0.3",
    "assemblyai>=0.28.0,<0.29",
    "langfuse>=2.40.0,<3",
    "chardet>=5.2.0,<6",
    "scrapingbee>=2.0.1,<3",
    "pytubefix>=8.6.0,<9",
    "structlog>=25.1.0,<26",
    "pydub>=0.25.1,<0.26",
    "google-genai>=1.1.0,<2",
    "protobuf>=5.29.3,<6",
    "jsonschema>=4.23.0,<5",
]

[dependency-groups]
dev = [
    "black>=24.10.0,<25",
    "isort>=5.13.2,<6",
    "pytest>=8.3.4,<9",
    "pylint>=3.3.3,<4",
    "python-dotenv>=1.0.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nagatoai_core"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".env",
    ".env.*",
    "inputs",
    "outputs",
]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["nagatoai_core"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
import_heading_stdlib = "Standard Library"
import_heading_thirdparty = "Third Party"
import_heading_firstparty = "Nagato AI"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["nagatoai_core"]
